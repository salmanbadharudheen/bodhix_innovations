<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <style>
      .orbit-flow { animation: orbit-flow 7s linear infinite; }
      .orbit-flow--reverse { animation: orbit-flow 10s linear infinite reverse; }
      @keyframes orbit-flow { to { stroke-dashoffset: -80; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit-flow,
        .orbit-flow--reverse { animation: none; }
      }
    </style>
    <linearGradient id="orbit" x1="89" y1="167" x2="526" y2="419" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D9E7" stop-opacity=".12"/>
      <stop offset=".42" stop-color="#8D66FF" stop-opacity=".75"/>
      <stop offset=".72" stop-color="#E45DCD" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FF9B55" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="ring" x1="143" y1="187" x2="462" y2="422" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55DDE8"/>
      <stop offset=".27" stop-color="#667BFF"/>
      <stop offset=".53" stop-color="#A45FEA"/>
      <stop offset=".76" stop-color="#E85DB5"/>
      <stop offset="1" stop-color="#FF9A55"/>
    </linearGradient>
    <linearGradient id="ringShade" x1="195" y1="164" x2="411" y2="439" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".74"/>
      <stop offset=".25" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset=".68" stop-color="#161330" stop-opacity=".02"/>
      <stop offset="1" stop-color="#17122E" stop-opacity=".68"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="matrix(164 173 -155 147 246 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#F8F5FF"/>
      <stop offset=".77" stop-color="#E8E2F8"/>
      <stop offset="1" stop-color="#D1D8EE"/>
    </radialGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="matrix(219 203 -203 219 301 296)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A873FF" stop-opacity=".24"/>
      <stop offset=".62" stop-color="#54CDE8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="orb-shadow" x="86" y="106" width="428" height="424" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="17"/>
      <feOffset dy="18"/>
      <feColorMatrix values="0 0 0 0 0.18 0 0 0 0 0.15 0 0 0 0 0.32 0 0 0 .22 0"/>
      <feBlend in2="SourceGraphic" mode="normal"/>
    </filter>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="246" fill="url(#aura)"/>
  <circle cx="300" cy="300" r="220" stroke="#6D5BD6" stroke-opacity=".08"/>
  <ellipse cx="300" cy="300" rx="232" ry="92" transform="rotate(-27 300 300)" stroke="url(#orbit)" stroke-width="2"/>
  <ellipse cx="300" cy="300" rx="226" ry="82" transform="rotate(39 300 300)" stroke="#6978CE" stroke-opacity=".18" stroke-width="1.5"/>
  <ellipse cx="300" cy="300" rx="181" ry="60" transform="rotate(-27 300 300)" stroke="#FFFFFF" stroke-opacity=".44" stroke-width="1"/>
  <ellipse class="orbit-flow" cx="300" cy="300" rx="232" ry="92" transform="rotate(-27 300 300)" stroke="url(#orbit)" stroke-width="3" stroke-dasharray="3 13" stroke-linecap="round"/>
  <ellipse class="orbit-flow--reverse" cx="300" cy="300" rx="226" ry="82" transform="rotate(39 300 300)" stroke="#57D8E5" stroke-opacity=".72" stroke-width="2.5" stroke-dasharray="2 18" stroke-linecap="round"/>

  <circle cx="300" cy="300" r="158" stroke="#3B2E71" stroke-opacity=".12" stroke-width="84" filter="url(#soft-glow)"/>
  <circle cx="300" cy="292" r="149" stroke="#30264F" stroke-opacity=".18" stroke-width="74" filter="url(#orb-shadow)"/>
  <circle cx="300" cy="292" r="149" stroke="url(#ring)" stroke-width="62"/>
  <circle cx="300" cy="292" r="149" stroke="url(#ringShade)" stroke-width="62"/>
  <path d="M197 186a149 149 0 0 1 192-8" stroke="#FFFFFF" stroke-opacity=".68" stroke-linecap="round" stroke-width="5"/>
  <path d="M419 355a149 149 0 0 1-114 85" stroke="#32265A" stroke-opacity=".35" stroke-linecap="round" stroke-width="7"/>
  <path d="M184 337a149 149 0 0 1-15-51" stroke="#FFFFFF" stroke-opacity=".45" stroke-linecap="round" stroke-width="3"/>

  <circle cx="300" cy="292" r="112" fill="url(#core)" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="2"/>
  <ellipse cx="265" cy="229" rx="43" ry="22" transform="rotate(-28 265 229)" fill="#FFFFFF" fill-opacity=".72" filter="url(#soft-glow)"/>
  <ellipse cx="263" cy="228" rx="34" ry="14" transform="rotate(-28 263 228)" fill="#FFFFFF" fill-opacity=".65"/>
  <path d="M228 365c38 26 97 30 143 7" stroke="#A89BCB" stroke-opacity=".18" stroke-width="2"/>
  <text x="300" y="323" fill="url(#ring)" font-family="Arial,sans-serif" font-size="111" font-weight="400" letter-spacing="-13" text-anchor="middle">B</text>
  <text x="300" y="350" fill="#777189" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="3" text-anchor="middle">IDEA / IMPACT</text>

  <g>
    <circle cx="130" cy="227" r="9" fill="#FFFFFF" stroke="#60DCE8" stroke-width="4"/>
    <circle cx="467" cy="196" r="8" fill="#FFFFFF" stroke="#A56AFF" stroke-width="4"/>
    <circle cx="467" cy="407" r="9" fill="#FFFFFF" stroke="#FF9564" stroke-width="4"/>
    <circle cx="191" cy="468" r="7" fill="#FFFFFF" stroke="#D965D0" stroke-width="3"/>
  </g>

  <g font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2">
    <rect x="34" y="291" width="88" height="30" rx="15" fill="#FFFFFF" fill-opacity=".96" stroke="#DAD6E6"/>
    <text x="78" y="310" fill="#625B74" text-anchor="middle">THINK</text>
    <rect x="473" y="301" width="93" height="30" rx="15" fill="#FFFFFF" fill-opacity=".96" stroke="#DAD6E6"/>
    <text x="519" y="320" fill="#625B74" text-anchor="middle">DESIGN</text>
    <rect x="249" y="510" width="84" height="30" rx="15" fill="#FFFFFF" fill-opacity=".96" stroke="#DAD6E6"/>
    <text x="291" y="529" fill="#625B74" text-anchor="middle">BUILD</text>
  </g>
</svg>
