<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <style>
      .orbit-glint { animation: orbit-glint 28s linear infinite; }
      .satellite-drift { animation: satellite-drift 8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sphere-float { animation: sphere-float 6.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes orbit-glint { to { stroke-dashoffset: -1000; } }
      @keyframes satellite-drift { 50% { transform: translateY(-8px); } }
      @keyframes sphere-float { 50% { transform: translateY(-5px) rotate(1deg); } }
      @media (prefers-reduced-motion: reduce) {
        .orbit-glint,
        .satellite-drift,
        .sphere-float { animation: none; }
      }
    </style>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="matrix(226 0 0 212 300 298)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8468F4" stop-opacity=".2"/>
      <stop offset=".54" stop-color="#61D8E6" stop-opacity=".1"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="88" y1="192" x2="517" y2="419" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58D8E7" stop-opacity=".28"/>
      <stop offset=".38" stop-color="#7273F2" stop-opacity=".86"/>
      <stop offset=".72" stop-color="#D66DDD" stop-opacity=".82"/>
      <stop offset="1" stop-color="#FFAB70" stop-opacity=".26"/>
    </linearGradient>
    <radialGradient id="sphere" cx="29%" cy="22%" r="82%">
      <stop stop-color="#F9FFFF"/>
      <stop offset=".09" stop-color="#A9F2EF"/>
      <stop offset=".28" stop-color="#55C7E9"/>
      <stop offset=".54" stop-color="#627BEF"/>
      <stop offset=".78" stop-color="#9B63E8"/>
      <stop offset="1" stop-color="#E77ABD"/>
    </radialGradient>
    <radialGradient id="sphere-shade" cx="73%" cy="76%" r="75%">
      <stop stop-color="#201859" stop-opacity=".62"/>
      <stop offset=".43" stop-color="#30206F" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sphere-rim" x1="196" y1="188" x2="411" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" stop-opacity=".85"/>
      <stop offset=".28" stop-color="#FFF" stop-opacity=".14"/>
      <stop offset=".68" stop-color="#37266C" stop-opacity=".05"/>
      <stop offset="1" stop-color="#201748" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="reflection" x1="210" y1="175" x2="292" y2="309" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" stop-opacity=".9"/>
      <stop offset=".48" stop-color="#FFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="surface-wave" x1="191" y1="293" x2="411" y2="371" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDFBFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#D5FAFF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#F8CAFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="satellite" cx="28%" cy="22%" r="82%">
      <stop stop-color="#FFF"/>
      <stop offset=".18" stop-color="#A8F5F0"/>
      <stop offset=".55" stop-color="#67C7EA"/>
      <stop offset="1" stop-color="#8265E9"/>
    </radialGradient>
    <radialGradient id="satellite-shade" cx="75%" cy="78%" r="75%">
      <stop stop-color="#32206F" stop-opacity=".58"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="orb-shadow" x="112" y="106" width="376" height="389" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="17"/>
      <feOffset dy="24"/>
      <feColorMatrix values="0 0 0 0 .16 0 0 0 0 .12 0 0 0 0 .35 0 0 0 .26 0"/>
      <feBlend in2="SourceGraphic" mode="normal"/>
    </filter>
    <filter id="soft-aura" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glint-blur" x="-80%" y="-100%" width="260%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="sphere-clip">
      <circle cx="300" cy="300" r="128"/>
    </clipPath>
  </defs>

  <circle cx="300" cy="300" r="226" fill="url(#aura)" filter="url(#soft-aura)"/>
  <g transform="translate(300 300) rotate(-27)">
    <ellipse rx="236" ry="91" stroke="url(#orbit)" stroke-opacity=".46" stroke-width="1.5"/>
    <ellipse rx="236" ry="91" pathLength="1000" stroke="url(#orbit)" stroke-width="3" stroke-dasharray="70 930" stroke-linecap="round" class="orbit-glint"/>
  </g>
  <g transform="translate(300 300) rotate(-27)">
    <path d="M-236 0A236 91 0 0 1 236 0" stroke="url(#orbit)" stroke-width="10" stroke-linecap="round" opacity=".34"/>
    <path d="M-236 0A236 91 0 0 1 236 0" stroke="url(#orbit)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M-236 0A236 91 0 0 1 236 0" stroke="#FFF" stroke-opacity=".7" stroke-width="1" stroke-linecap="round"/>
  </g>

  <g class="sphere-float">
    <circle cx="300" cy="300" r="133" fill="#6048C8" fill-opacity=".26" filter="url(#soft-aura)"/>
    <circle cx="300" cy="300" r="128" fill="url(#sphere)" filter="url(#orb-shadow)"/>
    <circle cx="300" cy="300" r="128" fill="url(#sphere-shade)"/>
    <g clip-path="url(#sphere-clip)">
      <path d="M164 289C221 255 269 260 316 283C356 303 388 302 432 271V447H164V289Z" fill="url(#surface-wave)" opacity=".8"/>
      <path d="M165 317C218 285 262 288 307 309C347 328 386 326 427 297" stroke="#F0FFFF" stroke-opacity=".22" stroke-width="2"/>
      <path d="M180 349C226 326 268 328 307 345C348 363 381 359 416 338" stroke="#E4D9FF" stroke-opacity=".18" stroke-width="1.5"/>
      <path d="M188 201C216 172 253 160 286 166" stroke="#FFF" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="237" cy="202" rx="39" ry="15" transform="rotate(-32 237 202)" fill="#FFF" fill-opacity=".42" filter="url(#glint-blur)"/>
      <ellipse cx="237" cy="202" rx="30" ry="8" transform="rotate(-32 237 202)" fill="url(#reflection)"/>
      <path d="M215 227C229 210 244 199 260 194" stroke="#FFF" stroke-opacity=".72" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="333" cy="372" rx="69" ry="27" transform="rotate(-27 333 372)" fill="#1C1452" fill-opacity=".17" filter="url(#glint-blur)"/>
    </g>
    <circle cx="300" cy="300" r="127" stroke="url(#sphere-rim)" stroke-width="2"/>
    <circle cx="300" cy="300" r="121" stroke="#FFF" stroke-opacity=".19" stroke-width="1"/>
  </g>

  <g class="satellite-drift">
    <circle cx="444" cy="216" r="35" fill="url(#satellite)" filter="url(#orb-shadow)"/>
    <circle cx="444" cy="216" r="35" fill="url(#satellite-shade)"/>
    <circle cx="444" cy="216" r="34" stroke="#FFF" stroke-opacity=".7" stroke-width="1.5"/>
    <ellipse cx="433" cy="204" rx="12" ry="5" transform="rotate(-34 433 204)" fill="#FFF" fill-opacity=".76"/>
    <path d="M426 211C431 204 437 200 443 198" stroke="#FFF" stroke-opacity=".75" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g class="satellite-drift" style="animation-delay:-3s">
    <circle cx="180" cy="389" r="25" fill="url(#satellite)" filter="url(#orb-shadow)"/>
    <circle cx="180" cy="389" r="25" fill="url(#satellite-shade)"/>
    <circle cx="180" cy="389" r="24" stroke="#FFF" stroke-opacity=".72" stroke-width="1.4"/>
    <ellipse cx="172" cy="380" rx="8" ry="3.5" transform="rotate(-34 172 380)" fill="#FFF" fill-opacity=".78"/>
  </g>
  <g transform="translate(300 300) rotate(-27)">
    <path d="M-236 0A236 91 0 0 1 236 0" stroke="url(#orbit)" stroke-width="8" stroke-linecap="round" opacity=".22"/>
    <path d="M-236 0A236 91 0 0 1 236 0" stroke="url(#orbit)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-236 0A236 91 0 0 1 236 0" stroke="#FFF" stroke-opacity=".66" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
